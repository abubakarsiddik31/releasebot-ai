version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: releasebot-ai:latest
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://releasebot:password@db:5432/releasebot
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    ports:
      - "8000:8000"  # FastAPI
      - "8501:8501"  # Streamlit
    depends_on:
      db:
        condition: service_healthy
    networks:
      - releasebot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: releasebot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: releasebot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: releasebot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - releasebot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasebot -d releasebot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  releasebot-network:
    driver: bridge
